workflows:
  tikatero-android-apk:
    name: Tikatero Android APK (test build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
    scripts:
      - name: Validate website URL
        script: |
          set -eu
          : "${EXPO_PUBLIC_TIKATERO_URL:?Add the Tikatero HTTPS website URL in Codemagic environment variables}"
          case "$EXPO_PUBLIC_TIKATERO_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_TIKATERO_URL must start with https://"; exit 1 ;;
          esac
      - name: Install Expo dependencies
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/android"
          npm install --no-audit --no-fund
          npx expo install --fix --npm
      - name: Validate TypeScript
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/android"
          npx tsc --noEmit
      - name: Generate Android project
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/android"
          CI=1 npx expo prebuild --platform android --non-interactive --no-install
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build installable release APK for testing
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/android/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          if ! test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"; then
            echo "No APK output found"
            exit 1
          fi
    artifacts:
      - apps/android/android/app/build/outputs/apk/release/*.apk
