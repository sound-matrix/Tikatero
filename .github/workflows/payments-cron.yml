name: Payments reconciliation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile pending payments
        run: >-
          curl -fsS -X GET --max-time 280
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ vars.APP_URL || 'https://tikatero.vercel.app' }}/api/cron/payments"
