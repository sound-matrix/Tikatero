name: Tikatero Android APK

on:
  push:
    branches:
      - feat/android-app-foundation
    paths:
      - ".github/workflows/tikatero-android-apk.yml"
      - "apps/android/**"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Tikatero HTTPS production origin"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tikatero-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/android
    env:
      CI: "1"
      EXPO_PUBLIC_TIKATERO_URL: ${{ inputs.site_url || vars.TIKATERO_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check production URL
        run: |
          node -e 'const s=process.env.EXPO_PUBLIC_TIKATERO_URL||"";if(!/^https:\/\/[^/]+\/?$/.test(s)){console.error("Set TIKATERO_SITE_URL to a live HTTPS domain");process.exit(1)}'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release-mode APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify bundled JavaScript and sign test APK
        run: |
          set -eu
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q 'index.android.bundle'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          if ! "$APKSIGNER" verify "$APK"; then
            keytool -genkeypair -keystore /tmp/tikatero-test.keystore -alias tikatero-test -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Tikatero Test,O=Sound Matrix,C=IN"
            "$APKSIGNER" sign --ks /tmp/tikatero-test.keystore --ks-key-alias tikatero-test --ks-pass pass:android --key-pass pass:android "$APK"
            "$APKSIGNER" verify "$APK"
          fi
          echo "Verified self-contained, signed test APK."
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Tikatero-Android-Standalone-APK
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
