<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tikatero — Book events anywhere</title>
<style>
:root{--c:#F25C54;--o:#FF9F43;--ink:#2D3142;--mut:#5C6170;--line:#E7E8EC;--teal:#0E9F9A;--gold:#C9A227;--green:#1F9D55;--red:#D93025;--soft:#F7F8FA}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Inter,"Segoe UI",Arial,sans-serif}
a{color:inherit}button,.btn{font:inherit;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600}
.cta{background:linear-gradient(135deg,var(--c),var(--o));color:#fff;border:0;box-shadow:0 6px 16px rgba(242,92,84,.25)}
.teal{color:var(--teal)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.mut{color:var(--mut)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px}
header .logo svg{height:52px;width:auto;display:block}nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}nav a{padding:12px 14px;border-radius:10px;text-decoration:none;font-weight:600}nav a.on{background:var(--soft)}
.mode{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}.mode a{padding:12px 14px;text-decoration:none;font-weight:600}.mode a.on{background:var(--ink);color:#fff}
.menu{display:none}
main{max-width:1200px;margin:0 auto;padding:24px}
h1{font-size:34px;line-height:1.2;margin:8px 0}h2{font-size:24px;margin:24px 0 12px}h3{font-size:19px;margin:0 0 6px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;margin:4px 6px 4px 0;background:#fff;cursor:pointer}.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.badge{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px}
.b-teal{background:#E3F6F5;color:var(--teal)}.b-gold{background:#FBF4DC;color:#8A6D0B}.b-green{background:#E5F5EC;color:var(--green)}.b-red{background:#FDE8E7;color:var(--red)}
input,select,textarea{font:inherit;min-height:48px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}label{font-weight:600;display:block;margin:12px 0 6px}
.search{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:10px;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 8px 30px rgba(45,49,66,.06)}
.ev{border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:block;background:#fff}.ev .pic{height:150px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:20px}.ev .bd{padding:14px}
.poster{border-radius:20px;min-height:280px;padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.tk{display:flex;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:#fff}
.tk .l{flex:1;padding:16px 18px}.tk .r{width:150px;padding:16px;border-left:2px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.tk .stripe{width:10px}.tk:before,.tk:after{content:"";position:absolute;right:141px;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line)}.tk:before{top:-9px}.tk:after{bottom:-9px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:48px;padding:0}
.map{height:200px;border-radius:14px;border:1px solid var(--line);overflow:hidden}.map iframe{width:100%;height:100%;border:0}
.person{text-align:center}.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;border:3px solid var(--gold)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.steps a{padding:10px 14px;border-radius:999px;background:var(--soft);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.steps a.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:15px}
.stat{font-size:30px;font-weight:800}.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.phone{width:360px;border:10px solid var(--ink);border-radius:40px;padding:18px;margin:0 auto;background:#fff}
.qr{display:block;width:200px;height:200px;margin:12px auto;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px}
.bookbar{display:none}.note{background:#E3F6F5;border-radius:12px;padding:12px 14px;color:#0B5F5C}
.plan{border:1.5px solid var(--line);border-radius:18px;padding:22px}.plan.pop{border-color:var(--c);box-shadow:0 10px 30px rgba(242,92,84,.12)}.price{font-size:34px;font-weight:800}
.scan{overflow:hidden;background:var(--ink);border-radius:20px;height:300px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}.scan .frame{width:190px;height:190px;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--mut)}
@media(max-width:820px){.desk-only{display:none}header{padding:8px 14px}header .logo svg{height:44px}nav,.mode.desk{display:none}.menu{display:inline-flex;margin-left:auto}
 nav.open{display:flex;position:absolute;top:62px;left:0;right:0;background:#fff;flex-direction:column;padding:10px;border-bottom:1px solid var(--line)}
 main{padding:14px 14px 100px}.g2,.g3,.g4,.search{grid-template-columns:1fr}h1{font-size:26px}.tk .r{width:110px}.tk:before,.tk:after{right:101px}
 .bookbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;gap:10px;align-items:center;z-index:30}.bookbar .btn{flex:1}.phone{width:100%;border:0;padding:0}}
</style></head><body>
<header><a class="logo" href="#home" aria-label="Tikatero home"><svg viewBox="0 0 360 96" role="img"><defs><linearGradient id="tkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F25C54"/><stop offset="1" stop-color="#FF9F43"/></linearGradient><radialGradient id="tks" cx=".5" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path d="M8 12h88v18a6 6 0 0 0 0 12v12a6 6 0 0 0 0 12v18H8V66a6 6 0 0 0 0-12V42a6 6 0 0 0 0-12z" fill="#fff" stroke="#2D3142" stroke-width="3" stroke-linejoin="round"/><line x1="74" y1="16" x2="74" y2="80" stroke="#2D3142" stroke-width="2" stroke-dasharray="3 4"/><rect x="20" y="20" width="46" height="56" rx="5" fill="url(#tkg)"/><path d="M43 20 L24 76 H62 Z" fill="url(#tks)"/><g fill="#2D3142"><circle cx="43" cy="40" r="4.5"/><path d="M39 46h8l2 14h-3l-1 12h-4l-1-12h-3z"/><path d="M46 47l8-12 2.5 1.5-7.5 13z"/></g><line x1="112" y1="80" x2="350" y2="80" stroke="#C9A227" stroke-width="1.5"/><text x="112" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#2D3142">Tikater<tspan fill="#F25C54">o</tspan></text></svg></a>
<span id="who" class="badge b-teal desk-only"></span>
<button class="menu" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Menu">☰ Menu</button>
<nav id="nav"></nav></header>
<main id="app"></main>
<div class="bookbar" id="bb"></div>
<footer id="ft"></footer>
<script>
const CUR={INR:[1,'₹'],USD:[0.012,'$'],AED:[0.044,'AED '],GBP:[0.0094,'£']};let cur='INR';
const money=v=>{const[r,s]=CUR[cur];const x=v*r;return s+(cur=='INR'?Math.round(x).toLocaleString('en-IN'):x.toFixed(2))};
const EV=[
{id:1,t:'Diwali Dhamaka Night',type:'Festival party',city:'Mumbai',country:'India',date:'Sat, 7 Nov 2026 · 7:00 PM',venue:'NSCI Dome, Worli, Mumbai 400018',q:'NSCI Dome Worli Mumbai',col:'#E8590C',col2:'#F7B32B',org:'Rangmanch Events',from:799},
{id:2,t:'Sunburn Arena ft. Live DJs',type:'Concert',city:'Bengaluru',country:'India',date:'Sat, 21 Nov 2026 · 5:00 PM',venue:'Embassy International Riding School, Bengaluru 562157',q:'Embassy International Riding School Bengaluru',col:'#6A1B9A',col2:'#F25C54',org:'Pulse Live',from:1499},
{id:3,t:'Christmas Carol Gala',type:'Music & Choir',city:'Kochi',country:'India',date:'Thu, 24 Dec 2026 · 6:30 PM',venue:'Bolgatty Palace, Mulavukad, Kochi 682504',q:'Bolgatty Palace Kochi',col:'#1B5E20',col2:'#C62828',org:'Harmony Kerala',from:499},
{id:4,t:'New Year Eve Rooftop 2027',type:'NYE party',city:'Dubai',country:'UAE',date:'Thu, 31 Dec 2026 · 9:00 PM',venue:'Business Bay, Dubai, UAE',q:'Business Bay Dubai',col:'#0D1B2A',col2:'#C9A227',org:'Skyline Nights',from:3999},
{id:5,t:'Startup Founders Meetup',type:'Conference',city:'Hyderabad',country:'India',date:'Sat, 14 Nov 2026 · 10:00 AM',venue:'T-Hub, Raidurg, Hyderabad 500081',q:'T-Hub Hyderabad',col:'#0E9F9A',col2:'#2D3142',org:'Founders Circle',from:0},
{id:6,t:'Diwali Mela London',type:'Cultural fair',city:'London',country:'UK',date:'Sun, 8 Nov 2026 · 12:00 PM',venue:'Trafalgar Square, London WC2N 5DN',q:'Trafalgar Square London',col:'#B23A48',col2:'#FF9F43',org:'Desi UK Events',from:0}];
const TIERS=[{n:'General Admission',p:799,perk:['Entry to main arena','Food court access'],left:412,c:'#0E9F9A'},{n:'Fan Pit',p:1999,perk:['Front-of-stage zone','Fast-lane entry','1 welcome drink'],left:38,c:'#F25C54'},{n:'VIP Lounge',p:4999,perk:['Lounge seating','Meet & greet','Unlimited food & drinks','Dedicated entry gate'],left:9,c:'#C9A227'}];
const VIP=[['Arijit Singh','Headline performer','#E8590C'],['Nucleya','DJ set','#6A1B9A'],['Mithila Palkar','Celebrity host','#0E9F9A'],['Ritesh Agarwal','Chief guest','#2D3142']];
let qty=[2,0,0],side='';
const qr=(s=7)=>{let c='',n=25,z=200/n;let x=s;for(let i=0;i<n;i++)for(let j=0;j<n;j++){x=(x*9301+49297)%233280;const f=(i<7&&j<7)||(i<7&&j>17)||(i>17&&j<7);const on=f?((i%6==0||j%6==0||(i%6>1&&i%6<5&&j%6>1&&j%6<5))&&!(i==7||j==7||i==17&&j<7||j==17&&i<7)):x/233280>.5;if(on)c+=`<rect x="${j*z}" y="${i*z}" width="${z}" height="${z}"/>`}return `<svg class="qr" viewBox="0 0 200 200" fill="#2D3142">${c}</svg>`};
const mapF=q=>`<div class="map"><iframe loading="lazy" title="Map" src="https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=14&output=embed"></iframe></div>`;
const maps=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const curSel=()=>`<select style="width:auto" onchange="cur=this.value;route()">${Object.keys(CUR).map(k=>`<option ${k==cur?'selected':''}>${k}</option>`).join('')}</select>`;
const evCard=e=>`<a class="ev" href="#event/${e.id}"><div class="pic" style="background:linear-gradient(135deg,${e.col},${e.col2})">${e.t}</div><div class="bd"><div class="mut">${e.date}</div><div><b>${e.city}, ${e.country}</b> · ${e.type}</div><div style="margin-top:6px;font-weight:700">${e.from?'From '+money(e.from):'<span class="green">Free</span>'}</div></div></a>`;
const tkt=(t,i,ev,big)=>`<div class="tk" style="margin:12px 0"><div class="stripe" style="background:${t.c}"></div><div class="l"><div class="mut" style="font-size:14px">${ev.t} · ${ev.date}</div><h3 style="color:${t.c==='#C9A227'?'#8A6D0B':t.c}">${t.c==='#C9A227'?'★ ':''}${t.n}</h3><div>${t.perk.join(' · ')}</div><div style="margin-top:6px">${t.left<15?`<span class="badge b-red">Only ${t.left} left</span>`:`<span class="badge b-teal">${t.left} seats left</span>`}</div></div><div class="r"><div style="font-size:22px;font-weight:800">${money(t.p)}</div><div class="mut" style="font-size:14px">incl. GST</div>${big?'':`<div class="qty"><button onclick="q(${i},-1)" aria-label="less">−</button><b id="q${i}">${qty[i]}</b><button onclick="q(${i},1)" aria-label="more">+</button></div>`}</div></div>`;
function total(){return qty.reduce((s,n,i)=>s+n*TIERS[i].p,0)}
function q(i,d){qty[i]=Math.max(0,Math.min(10,qty[i]+d));route()}
const V={};
V.home=()=>`<h1>Find events near you — or anywhere in the world</h1><p class="mut">Concerts, festivals, meetups and parties. Book in 3 taps. Show the QR at the door.</p>
<div class="search"><input placeholder="Search events, artists, venues" aria-label="Search"><input value="Mumbai, India" aria-label="City or country"><select aria-label="When"><option>This weekend</option><option>Diwali week</option><option>Christmas</option><option>New Year's Eve</option></select><a class="btn cta" href="#browse">Search</a></div>
<div style="margin-top:12px">${['Near me','Diwali 🪔','Christmas 🎄','New Year 🎉','Concerts','Comedy','Conferences','Free'].map((c,i)=>`<span class="chip ${i==0?'on':''}">${c}</span>`).join('')} <span style="float:right">Currency ${curSel()}</span></div>
<h2>Trending this festive season</h2><div class="grid g3">${EV.slice(0,6).map(evCard).join('')}</div>
<div class="card" style="margin-top:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="flex:1"><h3>Organising an event?</h3><div class="mut">Free for free events. Sell tickets from 1.5% + ₹5. Money in your bank within 2 days of settlement.</div></div><a class="btn" href="#apply">Apply as organiser</a><a class="btn" href="#pricing">See pricing</a></div>`;
V.browse=()=>`<h1>Events in all cities & countries</h1><div class="search"><input placeholder="Search"><input value="Anywhere"><select><option>Any date</option></select><a class="btn cta" href="#browse">Search</a></div>
<div style="margin:12px 0">${['India','UAE','UK','USA','Singapore'].map((c,i)=>`<span class="chip ${i==0?'on':''}">${c}</span>`).join('')} ${curSel()}</div>
<div class="grid g2"><div class="grid g2">${EV.map(evCard).join('')}</div><div><div class="map" style="height:520px"><iframe title="Map" src="https://maps.google.com/maps?q=India&z=4&output=embed"></iframe></div><p class="mut">Map shows events around the selected area.</p></div></div>`;
V.event=(id)=>{const e=EV.find(x=>x.id==id)||EV[0];return `
${location.hash.includes('share')?`<div class="note" style="margin-bottom:14px">🔗 You opened this from <b>${e.org}</b>'s shared link. Book here directly — no signup needed to pay.</div>`:''}
<div class="grid g2"><div class="poster" style="background:linear-gradient(160deg,${e.col},${e.col2})"><span class="badge" style="background:rgba(255,255,255,.2);color:#fff;align-self:flex-start">${e.type}</span><h1 style="font-size:40px">${e.t}</h1><div>${e.date}</div></div>
<div><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:56px;height:56px;font-size:18px;border-color:var(--teal);background:${e.col}">${e.org.split(' ').map(w=>w[0]).join('')}</div><div><b>${e.org}</b> <span class="badge b-teal">✓ Verified organiser</span><div class="mut">128 events hosted · 4.8★</div></div></div>
<h2>📍 Venue</h2><div><b>${e.venue}</b></div><div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" target="_blank" href="${maps(e.q)}">Open in Maps</a><a class="btn" target="_blank" href="https://wa.me/?text=${encodeURIComponent(e.t+' — book on Tikatero')}">Share on WhatsApp</a></div>${mapF(e.q)}</div></div>
<h2>★ Special guests</h2><div class="grid g4">${VIP.map(v=>`<div class="person"><div class="av" style="background:${v[2]}">${v[0].split(' ').map(w=>w[0]).join('')}</div><b>${v[0]}</b><div class="mut">${v[1]}</div></div>`).join('')}</div>
<h2>Choose your tickets</h2><p class="mut">Each ticket type has its own design. Prices include GST. ${curSel()}</p>
${TIERS.map((t,i)=>tkt(t,i,e)).join('')}
<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="flex:1"><b>${qty.reduce((a,b)=>a+b)} tickets</b> · Total <b style="font-size:22px">${money(total())}</b><div class="mut">Early-bird coupon <b>DIWALI10</b> applies at checkout</div></div><a class="btn cta" href="#checkout">Book now</a></div>
<p class="mut">Sold out? <a href="#" onclick="alert('Added to waitlist — we will WhatsApp you if seats open');return false">Join the waitlist</a> · Refund policy: full refund up to 72 hours before the event.</p>`};
V.checkout=()=>{const t=total(),d=Math.round(t*.1);return `<h1>Checkout</h1><p class="mut">One page. Takes under a minute.</p><div class="grid g2"><div class="card"><h3>Your details</h3><label>Full name</label><input value="Priya Sharma"><label>Mobile (WhatsApp)</label><input value="+91 98200 12345"><label>Email — tickets & PDF go here</label><input value="priya@example.com"><label>Pay with</label><div>${['UPI','Card','Netbanking','Wallet'].map((c,i)=>`<span class="chip ${i==0?'on':''}">${c}</span>`).join('')}</div><label>Coupon</label><input value="DIWALI10"><p class="teal">🔒 Secure payment by Cashfree</p></div>
<div class="card"><h3>Diwali Dhamaka Night</h3><div class="mut">Sat, 7 Nov 2026 · NSCI Dome, Mumbai</div><table>${qty.map((n,i)=>n?`<tr><td>${TIERS[i].n} × ${n}</td><td style="text-align:right">${money(n*TIERS[i].p)}</td></tr>`:'').join('')}<tr><td class="green">Coupon DIWALI10</td><td style="text-align:right" class="green">−${money(d)}</td></tr><tr><td><b>Total (incl. GST)</b></td><td style="text-align:right;font-size:22px"><b>${money(t-d)}</b></td></tr></table><p class="mut">No hidden fees. What you see is what you pay.</p><a class="btn cta" style="width:100%" href="#success">Pay ${money(t-d)}</a></div></div>`};
V.success=()=>`<div style="text-align:center;max-width:620px;margin:0 auto"><div style="font-size:60px" class="green">✓</div><h1 class="green">You're going!</h1><p>Booking <b>TK-7H3Q9</b> confirmed.</p><div class="note">📧 Tickets and event details have been emailed to <b>priya@example.com</b> with a PDF. Also sent on WhatsApp.</div><div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap"><a class="btn cta" href="#mytickets">Show my QR ticket</a><a class="btn" href="#pdf">Download PDF</a><a class="btn" href="#">Add to calendar</a></div></div>`;
V.mytickets=()=>`<h1>My Tickets</h1><div class="phone"><div class="mut" style="text-align:center">Tikatero app</div>${tkt(TIERS[0],0,EV[0],1)}<div style="text-align:center">${qr(3)}<b style="font-size:20px">Show this at Gate 1</b><div class="mut">Priya Sharma · General Admission · Ticket 1 of 2</div><div class="mut">Screen brightness up automatically · works offline</div></div><div style="display:grid;gap:8px;margin-top:12px"><a class="btn" href="#pdf">Download PDF</a><a class="btn" target="_blank" href="${maps(EV[0].q)}">Directions to venue</a><a class="btn" href="#">Transfer ticket to friend</a></div></div>`;
V.pdf=()=>`<h1>PDF ticket preview</h1><p class="mut">This is what's attached to the email and printed for physical tickets.</p><div class="card" style="max-width:720px;margin:0 auto;border:2px solid var(--ink)"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:22px">Tikater<span style="color:var(--c)">o</span></b><span class="badge b-teal">Rangmanch Events</span></div><hr style="border:0;border-top:1.5px solid var(--gold)"><div class="grid g2"><div><h2 style="margin-top:0">Diwali Dhamaka Night</h2><p>Sat, 7 Nov 2026 · Gates open 6:00 PM<br>NSCI Dome, Worli, Mumbai 400018</p><p><b>General Admission</b> · ₹799 incl. GST<br>Holder: Priya Sharma · TK-7H3Q9-01</p><p class="mut">Maps: maps.google.com/?q=NSCI+Dome+Worli</p></div><div style="text-align:center">${qr(3)}</div></div><p class="mut" style="font-size:14px">Entry with valid QR only. Each QR scans once. Terms at tikatero.com/t/TK-7H3Q9</p></div>`;
// Organiser
V.org=()=>`<h1>Organiser dashboard</h1><p class="mut">Rangmanch Events · you are <b>Admin</b></p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn cta" href="#create">+ Create event</a><a class="btn" href="#templates">Festival templates</a><a class="btn" href="#team">Team & roles</a></div>
<div class="grid g4" style="margin-top:18px">${[['Tickets sold','1,284','teal'],['Revenue (incl GST)','₹14,92,316',''],['Checked in today','0',''],['Next payout','₹6,10,400','green']].map(s=>`<div class="card"><div class="mut">${s[0]}</div><div class="stat ${s[2]}">${s[1]}</div></div>`).join('')}</div>

const LEG={privacy:['Privacy Policy',`<p>${LEGALCO}</p><h3>What we collect</h3><p>Name, email, mobile, booking and payment status (card data is handled by Cashfree, not stored by us), device data for security. For organisers: KYC data (PAN, masked Aadhaar, bank details, selfie) through licensed verification partners.</p><h3>Why</h3><p>To issue tickets, send event details, prevent fraud, pay organisers and meet legal duties, consistent with India's Digital Personal Data Protection Act, 2023.</p><h3>Sharing</h3><p>The organiser of an event you book gets your name, contact and ticket details. Service providers: payments, email/SMS/WhatsApp, hosting, verification.</p><h3>Your rights</h3><p>Access, correct, or delete your data from Settings; withdraw consent; grievance officer contact via the Help page.</p><h3>Retention</h3><p>Booking and tax records are kept as required by law (typically up to 8 years), then deleted.</p>`],
terms:['Terms & Conditions',`<p>${LEGALCO}</p><p>Tikatero is a marketplace: organisers sell tickets and are responsible for their events. Tickets are personal to the holder; each QR admits once. Resale above face value is not allowed. We may suspend accounts for fraud or misuse. Disputes are governed by the laws of India, courts at Ongole, Andhra Pradesh (to confirm with counsel).</p>`],
refund:['Refund Policy',`<p>Each event shows its own refund rule before you pay. If an event is cancelled, you get a full refund of the ticket price to the original payment method within 7 working days. If postponed, you may keep your ticket or request a refund. Platform and gateway fees are refundable when the event is cancelled.</p>`],
organiser:['Organiser Agreement',`<p>${LEGALCO}</p><p>Organisers must pass KYC and Tikatero approval before publishing. Fees: as shown on the Pricing page or agreed override. Payouts via Cashfree Easy Split after settlement; Tikatero may hold payouts for disputes, chargebacks or fraud review. Organisers are liable for event delivery and refunds if they cancel. <b>Organiser accounts can't be self-deleted</b>; closure is by request only after all events have ended and all payouts and refunds are settled.</p>`]};

const bb=document.getElementById('bb');bb.innerHTML=k=='event'?`<div><b>${money(total())}</b><div class="mut" style="font-size:14px">${qty.reduce((a,b)=>a+b)} tickets · incl GST</div></div><a class="btn cta" href="#checkout">Book now</a>`:k=='checkout'?`<a class="btn cta" href="#success">Pay ${money(total()-Math.round(total()*.1))}</a>`:'';bb.style.visibility=bb.innerHTML?'visible':'hidden'}
